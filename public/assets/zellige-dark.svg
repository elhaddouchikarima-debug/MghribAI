<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Central 8-Point Moroccan Star (Khatam) -->
    <g id="star8">
      <rect x="-18" y="-18" width="36" height="36" fill="#176B4D" fill-opacity="0.25" stroke="#C49A45" stroke-width="1.3" stroke-opacity="0.75"/>
      <rect x="-18" y="-18" width="36" height="36" transform="rotate(45)" fill="#176B4D" fill-opacity="0.25" stroke="#C49A45" stroke-width="1.3" stroke-opacity="0.75"/>
      <circle cx="0" cy="0" r="6.5" fill="#8C2635" fill-opacity="0.35" stroke="#C49A45" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="2.8" fill="#C49A45" fill-opacity="0.9"/>
    </g>
    <!-- Secondary Star in Burgundy / Gold -->
    <g id="starCorner">
      <rect x="-15" y="-15" width="30" height="30" fill="#8C2635" fill-opacity="0.25" stroke="#C49A45" stroke-width="1.1" stroke-opacity="0.6"/>
      <rect x="-15" y="-15" width="30" height="30" transform="rotate(45)" fill="#8C2635" fill-opacity="0.25" stroke="#C49A45" stroke-width="1.1" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="5" fill="#176B4D" fill-opacity="0.35" stroke="#C49A45" stroke-width="0.8" stroke-opacity="0.7"/>
    </g>
  </defs>

  <!-- Geometric Interlacing Guidelines -->
  <path d="M0,0 L120,120 M120,0 L0,120 M60,0 L60,120 M0,60 L120,60" stroke="#C49A45" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="3,3"/>
  
  <!-- Outer Diamond Interlacing (Saft) -->
  <polygon points="60,6 114,60 60,114 6,60" fill="none" stroke="#C49A45" stroke-width="1.2" stroke-opacity="0.45"/>
  <polygon points="60,18 102,60 60,102 18,60" fill="none" stroke="#8C2635" stroke-width="0.9" stroke-opacity="0.4"/>

  <!-- Center 8-pointed Moroccan Star -->
  <use href="#star8" x="60" y="60"/>

  <!-- 4 Corner Stars -->
  <use href="#starCorner" x="0" y="0"/>
  <use href="#starCorner" x="120" y="0"/>
  <use href="#starCorner" x="0" y="120"/>
  <use href="#starCorner" x="120" y="120"/>

  <!-- Edge Star Accents -->
  <use href="#starCorner" x="60" y="0"/>
  <use href="#starCorner" x="60" y="120"/>
  <use href="#starCorner" x="0" y="60"/>
  <use href="#starCorner" x="120" y="60"/>
</svg>
